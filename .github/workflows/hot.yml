name: Hot PR tests

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      engine-artifact:
        type: string
        default: ''
        description: Existing test engine artifact from this workflow run

permissions:
  contents: read

jobs:
  engine:
    if: github.repository == 'pawelchcki/wasmsmac' && inputs.engine-artifact == ''
    uses: ./.github/workflows/test-engine.yml
  hot:
    name: Hot lane (${{ matrix.kind }})
    needs: [engine]
    if: always() && github.repository == 'pawelchcki/wasmsmac'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [regression, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful engine producer
        env:
          TEST_ENGINE_RESULT: ${{ needs.engine.result }}
          TEST_ENGINE_ARTIFACT: ${{ inputs.engine-artifact }}
        run: python3 tools/behavior-tests/engine_gate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.engine-artifact || 'behavior-engine' }}
          path: build/wasm/bin
      - name: Check lane selection and active comparison infrastructure
        working-directory: tools/behavior-tests
        run: python3 -m unittest test_lanes test_unit_menu_orders test_unit_menu_context test_combine_observations test_headless_ui test_world_base_ownership test_natural_first_city test_natural_first_city_profiles test_ui_shards test_engine_gate test_terraform_menu test_terraform_menu_candidate test_colony_menu test_colony_menu_candidate test_unit_disband_contract test_unit_disband_candidate test_unit_recycling_contract test_unit_recycling_candidate test_unit_disband_shortcut_contract test_unit_disband_shortcut_candidate test_opening_art_contract test_opening_sequence_contract test_pod_landing_contract test_interface_tour_contract test_interface_tour_synthetic_contract test_interface_tour_observation test_state_trace test_state_trace_candidate test_state_trace_reference test_state_trace_identity test_world_minimum_generation test_base_operations test_trace_float_transport test_terrain_observation test_terrain_capture test_terraform_actions -v
      - name: Test all asset-free presentation invariants
        working-directory: tools/behavior-tests
        run: python3 -m unittest discover -p 'test_presentation*.py' -v
      - name: Validate production observation and projection contracts
        working-directory: tools/behavior-tests
        run: python3 -m unittest test_production_controls test_production_controls_native -v
      - name: Test bounded presentation transport without assets
        run: |
          node tools/behavior-tests/state_trace/presentation_bridge.test.mjs
          node tools/behavior-tests/state_trace/presentation_inputs.test.mjs
          node --test tools/wasm-tests/streaming-worker.test.mjs
      - name: Test FLIC and CVR decoding with synthetic assets
        run: python3 tools/texture-tests/run.py
      - name: Replay hot production controls and original comparisons
        run: python3 tools/behavior-tests/lanes.py --lane hot --kind '${{ matrix.kind }}' --jobs 2 --report build/hot-artifacts/hot.json
      - name: Verify exact native Float and JSON transport
        if: matrix.kind == 'regression'
        run: >-
          python3 tools/behavior-tests/state_trace/float_transport.py
          --runtime build/wasm/bin/GLSMAC.js
          --report build/hot-artifacts/native-json-transport.json
      - name: Capture complete terrain and traversal state for all seven players
        if: matrix.kind == 'regression'
        run: >-
          python3 tools/behavior-tests/state_trace/terrain_capture.py
          --runtime build/wasm/bin/GLSMAC.js
          --report build/hot-artifacts/terrain-observation.json
      - name: Replay all eight recorded startup production projections
        if: matrix.kind == 'regression'
        run: >-
          python3 tools/behavior-tests/ui/production_controls_native.py
          --runtime build/wasm/bin/GLSMAC.js
          --report build/hot-artifacts/production-native.json
          --logs build/hot-artifacts/production-native-logs
      - name: Replay bounded all-player native identity projections
        if: matrix.kind == 'regression'
        run: >-
          python3 tools/behavior-tests/state_trace/all_player_identity.py compare
          --runtime build/wasm/bin/GLSMAC.js
          --report build/hot-artifacts/all-player-identity.json
      - name: Replay minimum custom sizes through real native map generation
        if: matrix.kind == 'regression'
        run: >-
          python3 tools/behavior-tests/state_trace/world_minimum.py
          --runtime build/wasm/bin/GLSMAC.js
          --report build/hot-artifacts/world-minimum-generation.json
      - name: Replay bounded Base Operations UI navigation
        if: matrix.kind == 'regression'
        run: >-
          python3 tools/behavior-tests/state_trace/base_operations.py compare
          --runtime build/wasm/bin/GLSMAC.js
          --report build/hot-artifacts/base-operations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-behavior-${{ matrix.kind }}
          path: build/hot-artifacts
  terraform_actions:
    name: Terraform action traces
    needs: [engine]
    if: always() && github.repository == 'pawelchcki/wasmsmac'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful engine producer
        env:
          TEST_ENGINE_RESULT: ${{ needs.engine.result }}
          TEST_ENGINE_ARTIFACT: ${{ inputs.engine-artifact }}
        run: python3 tools/behavior-tests/engine_gate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.engine-artifact || 'behavior-engine' }}
          path: build/wasm/bin
      - name: Validate browser transport and staged worker contracts
        run: |
          test -f build/wasm/bin/GLSMAC.js
          test -f build/wasm/bin/GLSMAC.wasm
          node --test tools/wasm-tests/browser-log-cursor.test.mjs tools/wasm-tests/browser-native-log-hook.test.mjs tools/wasm-tests/runtime-fetch-barrier.test.mjs tools/wasm-tests/terraform-browser-geometry.test.mjs tools/wasm-tests/terraform-browser-pointer.test.mjs tools/wasm-tests/terraform-height-observation.test.mjs tools/wasm-tests/terraform-height-preflight.test.mjs tools/wasm-tests/gse-shards.test.mjs
          python3 tools/behavior-tests/test_terraform_height_browser_audit.py ProtocolAuditTests ProtocolFinalizationTests ExternalOutcomeTests DerivedOutputTests PreflightSchemaTests ProtocolPointerRouteTests ProtocolKeyboardRouteTests FrameFileTests InterpreterModeTests -v
          python3 -m unittest discover -s tools/behavior-tests -p 'test_fast*.py' -v
          STATE_TRACE_RUNTIME="$GITHUB_WORKSPACE/build/wasm/bin/GLSMAC.js" python3 -m unittest discover -s tools/behavior-tests -p 'test_behavior_groups.py' -v
      - name: Capture all 26 terraforming variants and ten worker commands
        run: >-
          python3 tools/behavior-tests/state_trace/terraform_actions.py
          --runtime build/wasm/bin/GLSMAC.js
          --artifacts build/hot-artifacts/terraform-actions
      - name: Validate complete seven-owner cooperative observation packets
        run: >-
          python3 tools/behavior-tests/state_trace/cooperative_capture.py
          --runtime build/wasm/bin/GLSMAC.js
          --artifacts build/hot-artifacts/cooperative-observation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-behavior-terraform-actions
          path: build/hot-artifacts
  complete:
    name: Hot tests
    needs: [hot, terraform_actions]
    if: always() && github.repository == 'pawelchcki/wasmsmac'
    runs-on: ubuntu-latest
    steps:
      - name: Require both hot lanes to succeed
        env:
          HOT_LANES_RESULT: ${{ needs.hot.result }}
          TERRAFORM_ACTIONS_RESULT: ${{ needs.terraform_actions.result }}
        run: |
          test "$HOT_LANES_RESULT" = success
          test "$TERRAFORM_ACTIONS_RESULT" = success
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: hot-behavior-*
          path: build/hot-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-behavior
          path: build/hot-artifacts
