name: Hot PR tests

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  hot:
    name: Hot tests
    if: github.repository == 'pawelchcki/wasmsmac'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - name: Restore compatible test engine
        id: engine
        uses: actions/cache@v4
        with:
          path: |
            build/wasm/bin/GLSMAC.js
            build/wasm/bin/GLSMAC.wasm
          key: behavior-engine-${{ runner.os }}-emscripten-4.0.22-v1-${{ hashFiles('src/**', 'cmake/**', 'CMakeLists.txt', 'tools/embedder.cpp', 'tools/CMakeLists.txt', 'tools/innoextract/**', 'tools/build-innoextract.py', 'resource/font/terminus/**') }}
      - name: Build test engine on cache miss
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.0.22 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.22
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.22
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=FastDebug
          cmake --build build/wasm -j4
      - name: Check lane selection and active comparison infrastructure
        working-directory: tools/behavior-tests
        run: python3 -m unittest test_lanes test_unit_menu_orders test_headless_ui -v
      - name: Replay hot production controls and original comparisons
        run: python3 tools/behavior-tests/lanes.py --lane hot --jobs 2 --report build/hot-artifacts/hot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-behavior
          path: build/hot-artifacts
