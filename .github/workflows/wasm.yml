name: Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wasm.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tools/CMakeLists.txt'
      - 'tools/wasm-tests/gse*.mjs'
      - 'tools/wasm-tests/gse*.cjs'
      - 'src/gc/**'
      - 'src/gse/**'
      - 'src/common/Mutex.*'
      # Compiled Census binding, cached resources/instances and headless prerequisites.
      - 'src/GLSMAC.*'
      - 'src/game/frontend/Game.*'
      - 'src/game/frontend/unit/Unit.*'
      - 'src/game/frontend/unit/UnitManager.*'
      - 'src/game/frontend/unit/UnitDef.*'
      - 'src/game/frontend/Slot.*'
      - 'src/game/frontend/unit/SlotBadges.*'
      - 'src/game/frontend/unit/BadgeDefs.*'
      - 'src/game/frontend/sprite/Sprite.h'
      - 'src/game/frontend/sprite/InstancedSprite.h'
      - 'src/game/frontend/sprite/InstancedSpriteManager.*'
      - 'src/scene/actor/Instanced.*'
      - 'src/scene/actor/Sprite.*'
      - 'src/scene/actor/Actor.*'
      - 'src/types/texture/Texture.*'
      - 'src/game/backend/Game.*'
      - 'src/game/backend/Random.*'
      - 'src/graphics/Null.h'
      - 'src/main.cpp'
      - 'src/ui/UI.*'
      - 'src/ui/geometry/Geometry.*'
      - 'resource/font/terminus/TerminusTTF-4.49.3-minified.ttf'

permissions:
  contents: read

jobs:
  engine:
    if: github.repository == 'pawelchcki/wasmsmac' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    uses: ./.github/workflows/test-engine.yml
  hot:
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    needs: [engine]
    uses: ./.github/workflows/hot.yml
    with:
      engine-artifact: behavior-engine
  native:
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/buildall.yml
  behavior:
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    name: Stable headless behavior (${{ matrix.kind }})
    needs: [engine]
    strategy:
      fail-fast: false
      matrix:
        kind: [regression, economy, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/download-artifact@v4
        with:
          name: behavior-engine
          path: build/wasm/bin
      - name: Validate all evidence and explicit lane membership
        if: matrix.kind == 'regression'
        run: python3 tools/behavior-tests/lanes.py --lane all --validate-only --report build/behavior-artifacts/evidence.json
      - name: Run stable regressions and recorded original comparisons
        run: |
          if [ '${{ matrix.kind }}' = regression ]; then
            python3 tools/smac-data/run.py --target native --report build/behavior-artifacts/smac-text-native.json
          fi
          python3 tools/behavior-tests/lanes.py --lane stable --kind '${{ matrix.kind }}' --jobs 2 --report build/behavior-artifacts/stable.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-behavior-${{ matrix.kind }}
          path: build/behavior-artifacts

  ui:
    name: Stable UI (${{ matrix.shard }}/4)
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    needs: [engine]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/download-artifact@v4
        with:
          name: behavior-engine
          path: build/wasm/bin
      - name: Replay this partition of recorded original cases
        run: python3 tools/behavior-tests/ui/run.py --lane stable --jobs 2 --shard '${{ matrix.shard }}/4' --report build/ui-shards/ui-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-ui-${{ matrix.shard }}
          path: build/ui-shards
          if-no-files-found: error

  ui-result:
    name: Complete stable UI coverage
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    needs: [engine, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: behavior-engine
          path: build/wasm/bin
      - uses: actions/download-artifact@v4
        with:
          pattern: stable-ui-*
          merge-multiple: true
          path: build/ui-shards
      - name: Require every recorded stable case exactly once
        run: python3 tools/behavior-tests/ui/shards.py --reports build/ui-shards --count 4 --lane stable --report build/behavior-artifacts/stable-ui.json
      - uses: actions/upload-artifact@v4
        with:
          name: stable-ui-coverage
          path: build/behavior-artifacts

  gse:
    name: Complete GSE (${{ matrix.shard }}/4)
    if: github.repository == 'pawelchcki/wasmsmac' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    needs: [engine]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/download-artifact@v4
        with:
          name: behavior-engine
          path: build/wasm/bin
      - name: Validate coverage aggregation
        run: node tools/wasm-tests/gse-shards.test.mjs
      - name: Execute native engine tests and this script partition
        run: node tools/wasm-tests/gse.test.mjs --shard '${{ matrix.shard }}/4' --report 'build/gse-shards/gse-${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gse-${{ matrix.shard }}
          path: build/gse-shards
          if-no-files-found: error

  gse-result:
    name: Complete GSE coverage
    if: always() && github.repository == 'pawelchcki/wasmsmac' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    needs: [gse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - name: Require every partition to succeed
        env:
          PARTITION_RESULT: ${{ needs.gse.result }}
        run: python3 -c 'import os; assert os.environ["PARTITION_RESULT"] == "success"'
      - uses: actions/download-artifact@v4
        with:
          pattern: gse-*
          merge-multiple: true
          path: build/gse-shards
      - name: Require every current script exactly once and native engine coverage
        run: node tools/wasm-tests/gse-shards.mjs --reports build/gse-shards --count 4 --output build/gse-coverage/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-gse-coverage
          path: build/gse-coverage

  wasm:
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: npm
          cache-dependency-path: tools/wasm-tests/package-lock.json
      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch 4.0.22 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.22
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.22
      - name: Build full application
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=FastDebug
          cmake --build build/wasm -j4
          emcmake cmake -S . -B build/wasm-release -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_YAML_CPP="$PWD/build/wasm/_deps/yaml_cpp-src"
          cmake --build build/wasm-release -j4
      - name: Test WASM graphics, platform code, and threads
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm --prefix tools/wasm-tests ci
          npm --prefix tools/wasm-tests test
          python3 -m unittest discover -s tools -p test_wasm_assets.py
      - name: Compare original-game behavior observations
        run: |
          python3 -m venv "$RUNNER_TEMP/smacx-reference"
          "$RUNNER_TEMP/smacx-reference/bin/pip" install -r tools/behavior-tests/requirements-reference.txt
          "$RUNNER_TEMP/smacx-reference/bin/python" -m unittest discover -s tools/behavior-tests -p 'test_*.py' -v
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 tools/smac-data/run.py --target wasm --report tools/wasm-tests/build/artifacts/smac-text-wasm.json
          python3 tools/behavior-tests/audit.py --lane stable --target wasm \
            --report tools/wasm-tests/build/artifacts/behavior-wasm-report.json
      - name: Test browser startup
        run: |
          cd tools/wasm-tests
          npx playwright install --with-deps chromium
          npm run test:assets
          npm run test:custom-maps
          npm run test:installer
          npm run test:pages
          npm run test:app
          WASM_APP_DIR="$GITHUB_WORKSPACE/build/wasm-release/bin" npm run test:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-rendering
          path: tools/wasm-tests/build/artifacts
      - name: Upload Pages site
        if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/wasm-release/bin

  result:
    name: Main CI
    if: always() && github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    needs: [engine, hot, native, behavior, ui-result, gse-result, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Require every main check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_CHECK'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY_CHECK

  pages:
    if: github.repository == 'pawelchcki/wasmsmac' && github.ref == 'refs/heads/main'
    needs: [result]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish WASM application
        id: deployment
        uses: actions/deploy-pages@v4
