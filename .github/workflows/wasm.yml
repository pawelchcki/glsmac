name: WebAssembly

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior:
    name: Fast headless behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - name: Restore compatible test engine
        id: behavior-engine
        uses: actions/cache@v4
        with:
          path: |
            build/wasm/bin/GLSMAC.js
            build/wasm/bin/GLSMAC.wasm
          # Scripts are loaded fresh by the worker. C++/toolchain changes must
          # rebuild the engine; test and production GSE edits reuse it safely.
          key: behavior-engine-${{ runner.os }}-emscripten-4.0.22-v1-${{ hashFiles('src/**', 'cmake/**', 'CMakeLists.txt', 'tools/embedder.cpp', 'tools/CMakeLists.txt', 'tools/innoextract/**', 'tools/build-innoextract.py', 'resource/font/terminus/**') }}
      - name: Build test engine on cache miss
        if: steps.behavior-engine.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.0.22 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/behavior-emsdk"
          "$RUNNER_TEMP/behavior-emsdk/emsdk" install 4.0.22
          "$RUNNER_TEMP/behavior-emsdk/emsdk" activate 4.0.22
          source "$RUNNER_TEMP/behavior-emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=FastDebug
          cmake --build build/wasm -j4
      - name: Run parallel behavior tests and validate original observations
        run: |
          python3 tools/behavior-tests/fast.py --jobs 4 --report build/behavior-artifacts/fast-report.json
          python3 tools/behavior-tests/audit.py --validate-only --report build/behavior-artifacts/reference-validation.json
          python3 tools/behavior-tests/audit.py --target native --report build/behavior-artifacts/implemented-parity.json
          python3 tools/behavior-tests/ui/run.py --validate-only --report build/behavior-artifacts/ui-evidence-validation.json
      - name: Require recorded original UX parity
        run: python3 tools/behavior-tests/ui/run.py --jobs 4 --report build/behavior-artifacts/ui-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-behavior
          path: build/behavior-artifacts

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: npm
          cache-dependency-path: tools/wasm-tests/package-lock.json
      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch 4.0.22 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.22
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.22
      - name: Build full application
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=FastDebug
          cmake --build build/wasm -j4
          emcmake cmake -S . -B build/wasm-release -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_YAML_CPP="$PWD/build/wasm/_deps/yaml_cpp-src"
          cmake --build build/wasm-release -j4
      - name: Test WASM graphics, platform code, and threads
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm --prefix tools/wasm-tests ci
          npm --prefix tools/wasm-tests test
          npm --prefix tools/wasm-tests run test:gse
          python3 -m unittest discover -s tools -p test_wasm_assets.py
      - name: Compare original-game behavior observations
        run: |
          python3 -m venv "$RUNNER_TEMP/smacx-reference"
          "$RUNNER_TEMP/smacx-reference/bin/pip" install -r tools/behavior-tests/requirements-reference.txt
          "$RUNNER_TEMP/smacx-reference/bin/python" -m unittest discover -s tools/behavior-tests -p 'test_*.py' -v
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 tools/behavior-tests/audit.py --target wasm \
            --report tools/wasm-tests/build/artifacts/behavior-wasm-report.json
      - name: Test browser startup
        run: |
          cd tools/wasm-tests
          npx playwright install --with-deps chromium
          npm run test:assets
          npm run test:custom-maps
          npm run test:installer
          npm run test:pages
          npm run test:app
          WASM_APP_DIR="$GITHUB_WORKSPACE/build/wasm-release/bin" npm run test:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-rendering
          path: tools/wasm-tests/build/artifacts
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && (github.ref_name == 'in_webbrowser' || github.ref_name == github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/wasm-release/bin

  pages:
    if: github.event_name != 'pull_request' && (github.ref_name == 'in_webbrowser' || github.ref_name == github.event.repository.default_branch)
    needs: [wasm, behavior]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish WASM application
        id: deployment
        uses: actions/deploy-pages@v4
