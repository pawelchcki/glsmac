name: Combat and unit lifecycle coverage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/coverage-combat-lifecycle.yml'
      - '.github/workflows/test-engine.yml'
      - 'GLSMAC_data/tests/_combat_native_fixture.gls.js'
      - 'GLSMAC_data/tests/_behavior.gls.js'
      - 'GLSMAC_data/tests/_gameplay_mocks.gls.js'
      - 'GLSMAC_data/tests/combat_rollback_regression.gls.js'
      - 'GLSMAC_data/tests/conventional_combat.gls.js'
      - 'GLSMAC_data/tests/unit_combat_model.gls.js'
      - 'GLSMAC_data/tests/gameplay_events.gls.js'
      - 'GLSMAC_data/default/game/event/attack_unit.gls.js'
      - 'GLSMAC_data/default/game/event/spawn_unit.gls.js'
      - 'GLSMAC_data/default/game/event/despawn_unit.gls.js'
      - 'GLSMAC_data/default/game/terraforming_support.gls.js'
      - 'src/game/backend/unit/**'
      - 'src/game/backend/Game.*'
      - 'src/game/backend/Player.*'
      - 'src/game/backend/map/tile/Tile.*'
      - 'src/gse/tests/mocks/ProductionFixture.cpp'
      - 'tools/behavior-tests/fast.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    if: github.repository == 'pawelchcki/wasmsmac'
    uses: ./.github/workflows/test-engine.yml
  coverage:
    name: Native combat state and casualty lifecycle
    needs: [engine]
    if: github.repository == 'pawelchcki/wasmsmac'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/download-artifact@v4
        with:
          name: behavior-engine
          path: build/wasm/bin
      - name: Exercise real native combat units and rollback
        run: >-
          python3 tools/behavior-tests/fast.py
          --runtime build/wasm/bin/GLSMAC.js
          --suite combat-rollback-regression
          --suite conventional-combat
          --suite unit-combat-model
          --suite gameplay-events
          --jobs 2
          --report build/combat-lifecycle-coverage/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-lifecycle-coverage
          path: build/combat-lifecycle-coverage
