name: Behavior test engine

on:
  workflow_call:

permissions:
  contents: read

jobs:
  engine:
    name: Build test engine
    if: github.repository == 'pawelchcki/wasmsmac'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - run: npm ci --ignore-scripts
      # Headless workers mount current host scripts and block embedded fallback.
      # Only engine/toolchain changes invalidate these reusable binaries.
      - name: Restore compatible test engine
        id: engine
        uses: actions/cache@v4
        with:
          path: |
            build/wasm/bin/GLSMAC.js
            build/wasm/bin/GLSMAC.wasm
          key: behavior-engine-${{ runner.os }}-emscripten-4.0.22-v2-${{ hashFiles('src/**', 'cmake/**', 'CMakeLists.txt', 'tools/embedder.cpp', 'tools/CMakeLists.txt', 'tools/innoextract/**', 'tools/build-innoextract.py', 'resource/font/terminus/**', 'scripts/contracts/**', 'tools/scripts/contracts.mjs', 'tools/scripts/wasm-loader.js') }}
      - name: Build test engine on cache miss
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.0.22 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.22
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.22
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=FastDebug
          cmake --build build/wasm -j4
      - name: Package current TypeScript even when the engine cache hits
        run: node tools/scripts/build.mjs --runtime-js build/wasm/bin/GLSMAC.js --stage build/wasm/bin/scripts
      - name: Execute a script-only edit with identical WASM bytes
        run: node tools/scripts/lifetime.mjs --wasm build/wasm/bin/GLSMAC.js
      - uses: actions/upload-artifact@v4
        with:
          name: script-package-lifetime
          path: build/scripts/lifetime-wasm.json
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-engine
          path: |
            build/wasm/bin/GLSMAC.js
            build/wasm/bin/GLSMAC.wasm
            build/wasm/bin/scripts
          if-no-files-found: error
          retention-days: 7
